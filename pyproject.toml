[project]
name = "local-llm"
version = "0.1.0"
description = "A tiny language model built from scratch, to learn how LLMs work."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390"]

[project.scripts]
local-llm = "local_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv.nosync"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
